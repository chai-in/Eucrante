name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift checks
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift Scripts/render-app-icon.swift

      - name: Validate project files and scripts
        run: |
          plutil -lint App/Info.plist App/Eucrante.entitlements App/Deno.entitlements App/YtDLP.entitlements
          ruby -e "require 'yaml'; YAML.safe_load(File.read('.github/dependabot.yml'))"
          zsh -n Scripts/*.sh

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run tests with coverage floor
        run: ./Scripts/check-coverage.sh 58 16

      - name: Run core integration checks
        run: swift run EucranteCoreChecks

      - name: Assemble app bundle
        run: make app
